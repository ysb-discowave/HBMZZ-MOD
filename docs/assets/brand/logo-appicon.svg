<?xml version="1.0" encoding="UTF-8"?>
<!--
  HBMZZ 应用图标（满幅）

  与 logo-favicon 的 H 完全一致，区别是底板铺到画布四边、不留描边与圆角：
  iOS / Android 会自己裁圆角，留白与外框只会变成一圈多余的边。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="HBMZZ">
  <title>HBMZZ</title>
  <rect width="64" height="64" fill="#0f1318"/>
  <rect x="17" y="15" width="9" height="34" fill="#e6ecf3"/>
  <rect x="38" y="15" width="9" height="34" fill="#e6ecf3"/>
  <rect x="17" y="27.5" width="34" height="9" fill="#f5a524"/>
</svg>
